# Configuration for the OpenManipulator pick-and-sort challenge.
# Joint order for every arm pose: [joint1, joint2, joint3, joint4] in radians.
# Gripper values are joint positions in metres.

gripper:
  open_limit: 0.02          # fully open
  close_limit: -0.02        # fully closed
  step: -0.001              # closing step; opening uses the same size, positive
  size_threshold: -0.004    # closed past this => small block, otherwise large

planning:
  pipeline: ompl
  velocity_scaling: 0.1     # fraction of max joint velocity (slow = safe)
  acceleration_scaling: 0.1

blocks:                     # edge lengths in metres (simulation only)
  small: 0.0225
  large: 0.045
  spawn_x: 0.2              # distance in front of the robot base

poses:
  pick:
    - [0.0, 0.00017, 0.00136, -0.0031]                       # home
    - [-1.3358950947048042e-05, -0.1061793044936232,         # reach the block
       0.6570420615335268, 0.35271669927253313]

  # Left bin receives small blocks. The right bin is derived by mirroring the
  # base rotation (joint1 sign flipped), see config.py.
  place_left:
    - [0.0, 0.00017, 0.00136, -0.0031]                       # home
    - [1.5992864912340499, 8.415907426146138e-05,            # rotate to the bin
       1.5226615549514953e-06, 5.400218179825652e-05]
    - [1.5992663386140384, 0.35269513249348816,              # lower into the bin
       0.19473188525619556, 0.08812983289545956]
